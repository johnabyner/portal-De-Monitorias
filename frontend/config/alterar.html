<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Monitorias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="alterar.css">
</head>

<body class="cadastro">
    <div id="navbar"></div>

    <form action="alterar.html" method="post" class="formulario-cadastro formulario-alterar">
        <div class="title-formulario">
            <h2>Alterar configurações</h2>
        </div>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <fieldset class="campo">
            <legend>Sexo</legend>

            <div class="opcoes-sexo">
                <label>
                    <input type="radio" name="sexo" value="masculino" required>
                    Masculino
                </label>

                <label>
                    <input type="radio" name="sexo" value="feminino">
                    Feminino
                </label>

                <label>
                    <input type="radio" name="sexo" value="outro">
                    Outro
                </label>
            </div>
        </fieldset>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit">Enviar</button>
    </form>

    <script type="module" src="../js/navbar.js"></script>
</body>
</html>
