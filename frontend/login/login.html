<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Monitorias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../index.css">
</head>

<body class="login">
    <div id="navbar"></div>
        <form 
            action="login.html" 
            method="post" 
            class="formulario-login"
            novalidate
        >

        <div class="title-formulario">
            <h2>Login</h2>
        </div>

        <span id="mensagem-login" ></span>

        <div class="campo">
            <label for="matricula">Matricula</label>
            <input
                type="text"
                id="matricula"
                name="matricula"
                placeholder="Digite sua matricula"
                minlength="8"
                maxlength="11"
                pattern="[0-9]+"
                title="A matrícula deve conter apenas números"
                inputmode="numeric"
                required
            >
            <span class="mensagem-erro"></span>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                minlength="8"
                required
            >
            <span class="mensagem-erro"></span>
        </div>

        <button type="submit">
            Entrar
        </button>

        <div class="cadastro-link">
            <span>Não tem uma conta?</span>
            <a href="../cadastro/cadastro.html">Cadastre-se</a>
        </div>
    </form>

    <script  type="module" src="../js/validacaoLogin.js"></script>
    <script type="module" src="../js/navbar.js"></script>
</body>
</html>
