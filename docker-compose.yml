#http://localhost:5500/home/index.html

name: portal-monitorias

services:
  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DOCKER_USER}
      POSTGRES_PASSWORD: ${DOCKER_PASSWORD}
      POSTGRES_DB: ${DOCKER_DB}

    volumes:
      - portal_monitorias:/var/lib/postgresql
      - ./backend/migrations/structureSchema.sql:/docker-entrypoint-initdb.d/01-structure.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-7777}:${BACKEND_PORT:-7777}"

    environment:
      NODE_ENV: production
      BACKEND_PORT: ${BACKEND_PORT:-7777}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DATABASE_URL: "postgresql://${DOCKER_USER}:${DOCKER_PASSWORD}@db:5432/${DOCKER_DB}"

    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    image: busybox:1.37
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend:/www:ro
    depends_on:
      - backend

volumes:
  portal_monitorias: